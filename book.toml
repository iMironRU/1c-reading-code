[book]
title = "1С как иностранный язык"
authors = ["Мирошниченко Александр (aka iMiron)"]
language = "ru"
src = "."

[build]
build-dir = "book"

[output.html]
site-url = "/"
git-repository-url = "https://github.com/iMironRU/1c-semantic-reading"
edit-url-template = ""
additional-js = ["theme/version.js"]
additional-css = ["theme/book-extra.css"]
no-section-label = false
fold.enable = true
fold.level = 1
search.enable = true
search.limit-results = 30
search.teaser-word-count = 30

[output.html.playground]
editable = false
