title: "1С как иностранный язык"
subtitle: "Учебный курс для абсолютных новичков"
author: "Мирошниченко Александр (aka iMiron)"
author_url: "https://github.com/iMironRU"
language: ru
license: "CC BY 4.0"
version: "0.9.0"

# Отслеживание шаблона
template_repo: "https://github.com/iMironRU/book-template"
template_version: "v0.2.1"

formats:
  epub:     true
  fb2:      true
  pdf_a5:   true
  pdf_a4:   false
  html:     true
  docx:     true
  docx_a4:  false
  site:     true

release_filter: "review"
nightly_filter: "all"

artifacts: []

site_url: "https://imiron.ru/1c-reading-code/"

nightly:
  enabled: true
  branch: "main"

pdf:
  font_main: "PT Serif"
  font_mono: "JetBrains Mono"
  font_size: "11pt"
  margin_a5: "top=20mm,right=15mm,bottom=20mm,left=20mm"
  margin_a4: "top=25mm,right=20mm,bottom=25mm,left=25mm"

# ─────────────────────────────────────────────
#  НАЗВАНИЯ МОДУЛЕЙ (заголовки разделов в SUMMARY)
#  Ключ — слаг папки в chapters/
# ─────────────────────────────────────────────
modules:
  00_vvedenie: "Модуль 0. Введение"
  01_leksika: "Модуль 1. Лексика"
  02_semantika: "Модуль 2. Семантика"
  03_struktura: "Модуль 3. Структура"
  04_patterny: "Модуль 4. Паттерны"
  05_idiomy: "Модуль 5. Идиомы"
  06_kontekst: "Модуль 6. Контекст"
  07_kachestvo: "Модуль 7. Качество"
  08_sistema: "Модуль 8. Система"
  09_zavershenie: "Модуль 9. Завершение"
