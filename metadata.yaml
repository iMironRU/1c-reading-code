title: "1С как иностранный язык"
subtitle: "Учебный курс для абсолютных новичков"
author: "Мирошниченко Александр (aka iMiron)"
author_url: "https://github.com/iMironRU"
language: ru
license: "CC BY 4.0"
version: "0.9.0"

# Отслеживание шаблона
template_repo: "https://github.com/iMironRU/book-template"
template_version: "v0.2.1"

formats:
  epub:     true
  fb2:      true
  pdf_a5:   true
  pdf_a4:   false
  html:     true
  docx:     true
  docx_a4:  false
  site:     true

release_filter: "review"
nightly_filter: "all"

artifacts: []

site_url: "https://imiron.ru/1c-reading-code/"

nightly:
  enabled: true
  branch: "main"

pdf:
  font_main: "PT Serif"
  font_mono: "JetBrains Mono"
  font_size: "11pt"
  margin_a5: "top=20mm,right=15mm,bottom=20mm,left=20mm"
  margin_a4: "top=25mm,right=20mm,bottom=25mm,left=25mm"
